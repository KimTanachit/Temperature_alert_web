<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้ดูแลระบบ</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .login-card {
      background: #fff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .login-card h2 {
      margin-bottom: 20px;
      color: #333;
    }
    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .login-card button:hover {
      background: #1d4ed8;
    }
    .back-home {
      display: inline-block;
      margin-top: 15px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    #errorMsg {
      color: #ef4444;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>🔐 เข้าสู่ระบบ Admin</h2>
      <form id="loginForm">
        <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน (admin)" required autocomplete="off">
        <input type="password" id="password" placeholder="รหัสผ่าน (admin1234)" required>
        <button type="submit">เข้าสู่ระบบ</button>
        <p id="errorMsg"></p>
      </form>
      <a href="/" class="back-home">← กลับหน้าหลัก</a>
    </div>
  </div>

  <script>
    // Only allow known local pages as post-login destinations.
    const requestedPage = new URLSearchParams(window.location.search).get("next");
    const nextPage = ["/servocontrol.html", "/settings.html"].includes(requestedPage)
      ? requestedPage
      : "/settings.html";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = nextPage;
        } else {
          errorMsg.innerText = data.message || "เข้าสู่ระบบไม่สำเร็จ";
          errorMsg.style.display = "block";
        }
      } catch (err) {
        errorMsg.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
