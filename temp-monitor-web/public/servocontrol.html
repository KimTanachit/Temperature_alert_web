<script>
    const API_TOKEN = "servo-god-1234";

    const statusEl = document.getElementById("servoStatus");
    const distanceEl = document.getElementById("distanceValue");
    const objectTempEl = document.getElementById("objectTempValue");
    const sensorStatusEl = document.getElementById("sensorStatusValue");

    let activeButton = null;

    async function moveCamera(x, y) {
        try {
            const res = await fetch("/api/move", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: API_TOKEN,
                    x: x,
                    y: y
                })
            });

            if (!res.ok) {
                statusEl.textContent = "ส่งคำสั่งไม่สำเร็จ";
                return;
            }

            statusEl.textContent = x === 0 && y === 0 ? "หยุดแล้ว" : "กำลังหมุน";
        } catch (err) {
            statusEl.textContent = "เชื่อมต่อ server ไม่ได้";
        }
    }

    function stopCamera() {
        if (activeButton) {
            activeButton.classList.remove("pressed");
            activeButton = null;
        }

        moveCamera(0, 0);
    }

    function bindHoldButton(id, x, y) {
        const button = document.getElementById(id);

        button.addEventListener("pointerdown", function (event) {
            event.preventDefault();

            if (activeButton && activeButton !== button) {
                activeButton.classList.remove("pressed");
            }

            activeButton = button;
            button.classList.add("pressed");

            try {
                button.setPointerCapture(event.pointerId);
            } catch (err) {}

            moveCamera(x, y);
        });

        button.addEventListener("pointerup", function (event) {
            event.preventDefault();
            stopCamera();
        });

        button.addEventListener("pointercancel", stopCamera);
        button.addEventListener("lostpointercapture", stopCamera);
        button.addEventListener("pointerleave", stopCamera);
    }

    async function readSensors() {
        try {
            const res = await fetch("/api/sensors", {
                cache: "no-store"
            });

            const data = await res.json();

            distanceEl.textContent = data.distance_mm >= 0 ? data.distance_mm : "--";

            objectTempEl.textContent =
                data.room_temp_c === null || data.room_temp_c === undefined
                    ? "--"
                    : Number(data.room_temp_c).toFixed(2);

            sensorStatusEl.textContent = data.sensor_text || "--";
        } catch (err) {
            sensorStatusEl.textContent = "offline";
        }
    }

    function tempToColor(value, min, max) {
        const range = Math.max(max - min, 0.01);
        const t = Math.max(0, Math.min(1, (value - min) / range));

        const r = Math.round(255 * t);
        const g = Math.round(80 * (1 - Math.abs(t - 0.5) * 2));
        const b = Math.round(255 * (1 - t));

        return `rgb(${r}, ${g}, ${b})`;
    }

    async function drawThermalImage() {
        const canvas = document.getElementById("thermalCanvas");

        if (!canvas) {
            return;
        }

        const ctx = canvas.getContext("2d");

        try {
            const res = await fetch("/api/sensors", {
                cache: "no-store"
            });

            const data = await res.json();
            const pixels = data.amg_pixels || [];

            document.getElementById("amgMin").textContent =
                data.amg_min_temp_c === null || data.amg_min_temp_c === undefined
                    ? "-- °C"
                    : `${Number(data.amg_min_temp_c).toFixed(1)} °C`;

            document.getElementById("amgMax").textContent =
                data.amg_max_temp_c === null || data.amg_max_temp_c === undefined
                    ? "-- °C"
                    : `${Number(data.amg_max_temp_c).toFixed(1)} °C`;

            document.getElementById("amgCenter").textContent =
                data.amg_center_temp_c === null || data.amg_center_temp_c === undefined
                    ? "-- °C"
                    : `${Number(data.amg_center_temp_c).toFixed(1)} °C`;

            if (!Array.isArray(pixels) || pixels.length !== 64) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                document.getElementById("thermalStatus").textContent = "No thermal image";
                return;
            }

            const min = Math.min(...pixels);
            const max = Math.max(...pixels);
            const cell = canvas.width / 8;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const temp = Number(pixels[row * 8 + col]);

                    ctx.fillStyle = tempToColor(temp, min, max);
                    ctx.fillRect(col * cell, row * cell, cell, cell);

                    ctx.strokeStyle = "rgba(255,255,255,0.25)";
                    ctx.strokeRect(col * cell, row * cell, cell, cell);
                }
            }

            document.getElementById("thermalStatus").textContent =
                Number(data.amg_status) === 1 ? "AMG8833 online" : "AMG8833 offline";

        } catch (err) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById("thermalStatus").textContent = "Thermal fetch failed";
        }
    }

    bindHoldButton("btnUp", 0, -1);
    bindHoldButton("btnDown", 0, 1);
    bindHoldButton("btnLeft", -1, 0);
    bindHoldButton("btnRight", 1, 0);

    document.getElementById("btnStop").addEventListener("click", stopCamera);
    window.addEventListener("blur", stopCamera);

    document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
            stopCamera();
        }
    });

    readSensors();
    drawThermalImage();

    setInterval(readSensors, 2000);
    setInterval(drawThermalImage, 1000);
</script>
